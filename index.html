<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>所有相簿</title>
  <style>
    :root {
      --line-green: #06C755;
      --line-green-dark: #05B04B;
      --danger: #E53935;
      --bg: #FFFFFF;
      --surface: #F4F5F7;
      --text: #111111;
      --sub: #8C8C8C;
      --border: #EFEFEF;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    /* ===== LINE 原生極簡頂部列 ===== */
    .header {
      position: sticky; top: 0; z-index: 150;
      background: #FFFFFF; border-bottom: 1px solid var(--border);
    }
    .header-inner { max-width: 980px; margin: 0 auto; }
    .header-top {
      height: 56px; padding: 0 14px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .header-left { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
    .header-title {
      font-size: 18px; font-weight: 700; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .owner-dot {
      display: none; font-size: 11px; font-weight: 600;
      color: #058A3C; background: #EAF9F0;
      padding: 2px 8px; border-radius: 99px; flex-shrink: 0;
    }
    .header-right { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }

    .icon-btn {
      width: 38px; height: 38px; border-radius: 50%;
      border: none; background: transparent; color: #111;
      cursor: pointer; position: relative;
      display: inline-flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .icon-btn:hover { background: #F2F3F5; }
    .icon-btn:active { background: #E6E8EB; }
    .icon-btn.circle-soft { background: #F4F5F7; }
    .icon-btn.circle-soft:hover { background: #E8EAED; }
    .icon-btn.spinning svg { animation: spin 0.9s linear infinite; }

    .icon-btn[data-tip]:hover::after {
      content: attr(data-tip);
      position: absolute; top: 44px; left: 0;
      background: #FFFFFF; color: #111; font-size: 13px; font-weight: 500;
      padding: 6px 12px; border-radius: 6px; white-space: nowrap;
      box-shadow: 0 3px 12px rgba(0,0,0,0.14); border: 1px solid #EAEAEA;
      z-index: 300; pointer-events: none;
    }

    /* 搜尋列 */
    .search-bar-wrap { padding: 0 14px 10px; display: block; }
    .search-bar-wrap.collapsed { display: none; }
    .search-box {
      display: flex; align-items: center; gap: 8px;
      background: var(--surface); border-radius: 20px; padding: 8px 14px;
    }
    .search-box svg { color: #555; flex-shrink: 0; }
    .search-box input {
      border: none; background: transparent; outline: none;
      width: 100%; font-size: 14px; color: var(--text);
    }
    .search-box input::placeholder { color: #9A9A9A; }
    .search-clear {
      border: none; background: #C8CACC; color: #fff; border-radius: 50%;
      width: 18px; height: 18px; font-size: 11px; line-height: 18px;
      text-align: center; cursor: pointer; display: none; padding: 0; flex-shrink: 0;
    }

    /* 群組頁籤 */
    .group-tabs {
      display: flex; overflow-x: auto; gap: 6px;
      padding: 0 14px; scrollbar-width: none;
    }
    .group-tabs::-webkit-scrollbar { display: none; }
    .group-tab {
      flex: 0 0 auto; padding: 10px 10px; font-size: 14px; font-weight: 600;
      color: var(--sub); border: none; background: none; cursor: pointer;
      border-bottom: 2px solid transparent; white-space: nowrap;
    }
    .group-tab.active { color: var(--text); border-bottom-color: var(--text); }

    /* LINE 白色懸浮選單 */
    .popover-menu {
      position: fixed; z-index: 4000;
      min-width: 188px; background: #FFFFFF;
      border-radius: 8px; padding: 6px 0;
      box-shadow: 0 4px 20px rgba(0,0,0,0.16); border: 1px solid #EAEAEA;
      display: none;
    }
    .popover-item {
      width: 100%; border: none; background: none; text-align: left;
      padding: 11px 16px; font-size: 14px; color: #111; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .popover-item:hover { background: #F5F6F8; }
    .popover-item.danger { color: var(--danger); }
    .popover-item .check { color: var(--line-green); font-weight: 700; }
    .popover-divider { height: 1px; background: #F0F0F0; margin: 4px 0; }

    /* 次要資訊條 */
    .sub-strip {
      max-width: 980px; margin: 0 auto;
      padding: 10px 16px 2px;
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
      font-size: 12px; color: var(--sub);
    }
    .share-link-btn {
      border: 1px solid #D5EFE0; background: #F2FBF6; color: #058A3C;
      border-radius: 99px; padding: 4px 12px; font-size: 12px; font-weight: 600;
      cursor: pointer; display: none; align-items: center; gap: 5px;
    }
    .share-link-btn:hover { background: #E4F7EC; }

    /* ===== 相簿列表 ===== */
    .album-list {
      max-width: 980px; margin: 0 auto;
      padding: 10px 14px 40px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 22px 18px;
    }
    .load-more-wrap { text-align: center; padding: 0 16px 96px; display: none; }
    .load-more-btn {
      padding: 10px 28px; border-radius: 99px;
      border: 1px solid #DCDFE4; background: #FFFFFF; color: #333;
      font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .load-more-btn:hover { background: #F4F5F7; }

    .album-card { background: #FFFFFF; cursor: pointer; }
    .collage {
      width: 100%; aspect-ratio: 4 / 3;
      border-radius: 10px; overflow: hidden;
      display: grid; gap: 2px; background: #FFFFFF; border: 1px solid #F0F0F0;
    }
    .collage.c1 { grid-template-columns: 1fr; }
    .collage.c2 { grid-template-columns: 1fr 1fr; }
    .collage.c3 { grid-template-columns: 2fr 1fr; grid-template-rows: 1fr 1fr; }
    .collage.c3 .collage-item:first-child { grid-row: span 2; }
    .collage.c4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
    .collage-item { position: relative; width: 100%; height: 100%; overflow: hidden; background: #F2F3F5; }
    .collage-item img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.2s; }
    .album-card:hover .collage-item img { transform: scale(1.02); }

    .video-badge {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 34px; height: 34px; border-radius: 50%;
      background: rgba(0, 0, 0, 0.55); color: #fff;
      display: flex; align-items: center; justify-content: center;
      border: 1.5px solid rgba(255,255,255,0.9); pointer-events: none;
    }
    .video-tag-corner {
      position: absolute; right: 6px; bottom: 6px;
      background: rgba(0, 0, 0, 0.62); color: #fff;
      font-size: 11px; padding: 2px 6px; border-radius: 4px; pointer-events: none;
    }

    .album-footer {
      display: flex; align-items: flex-start; justify-content: space-between;
      padding: 10px 2px 0; gap: 8px;
    }
    .album-text { min-width: 0; flex: 1; }
    .album-title {
      font-size: 16px; font-weight: 700; color: #111;
      line-height: 1.35; margin: 0 0 3px; word-break: break-word;
    }
    .album-meta-line {
      font-size: 13px; color: var(--sub);
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .group-chip {
      font-size: 11px; color: #555; background: #F2F3F5;
      padding: 1px 7px; border-radius: 4px;
    }
    .card-dots-btn {
      width: 32px; height: 32px; border-radius: 50%; border: none;
      background: transparent; color: #555; cursor: pointer; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center; margin-top: -2px;
    }
    .card-dots-btn:hover { background: #F2F3F5; color: #111; }

    /* ===== 單一相簿內頁 ===== */
    #detailView { display: none; min-height: 100vh; background: #FFFFFF; }
    .detail-topbar {
      position: sticky; top: 0; z-index: 150;
      background: rgba(255,255,255,0.96); backdrop-filter: blur(6px);
      border-bottom: 1px solid var(--border);
    }
    .detail-topbar-inner {
      max-width: 980px; margin: 0 auto; height: 52px; padding: 0 12px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .detail-hero { max-width: 980px; margin: 0 auto; padding: 18px 18px 16px; }
    .detail-hero-title {
      font-size: 24px; font-weight: 700; color: #111111;
      line-height: 1.35; margin: 0 0 8px; word-break: break-word;
    }
    .detail-hero-count { font-size: 14px; color: var(--sub); margin: 0 0 4px; }
    .detail-hero-date { font-size: 14px; color: var(--sub); margin: 0; }

    .photo-grid {
      max-width: 980px; margin: 0 auto;
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 2px; padding: 0 0 96px;
    }
    @media (min-width: 720px) {
      .photo-grid { grid-template-columns: repeat(5, 1fr); gap: 6px; padding: 0 18px 96px; }
    }
    .photo-cell {
      aspect-ratio: 1 / 1; background: #F2F3F5; overflow: hidden; cursor: pointer; position: relative;
    }
    .photo-cell img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* LINE 綠色圓形「＋」懸浮按鈕 */
    .fab {
      position: fixed; right: 22px; bottom: 24px; z-index: 300;
      width: 56px; height: 56px; border-radius: 50%;
      background: var(--line-green); color: #fff; border: none;
      cursor: pointer; box-shadow: 0 4px 14px rgba(6, 199, 85, 0.42);
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.12s, background 0.15s;
    }
    .fab:active { transform: scale(0.93); background: var(--line-green-dark); }

    /* ===== 仿 LINE 全螢幕「建立相簿」預覽頁 ===== */
    #createAlbumView {
      position: fixed; inset: 0; z-index: 5000;
      background: #FFFFFF;
      display: none; flex-direction: column;
    }
    .composer-top {
      height: 54px; padding: 0 12px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    }
    .composer-top-title { font-size: 17px; font-weight: 700; color: #111; }
    .composer-submit-btn {
      border: none; background: var(--line-green); color: #fff;
      font-size: 14px; font-weight: 700; padding: 8px 18px; border-radius: 99px;
      cursor: pointer;
    }
    .composer-submit-btn:disabled { background: #CBEED9; cursor: not-allowed; }

    .composer-body {
      flex: 1; overflow-y: auto; max-width: 720px; width: 100%; margin: 0 auto;
      padding: 18px 16px 40px;
    }
    .composer-title-input {
      width: 100%; border: none; border-bottom: 1.5px solid #E5E7EB;
      padding: 10px 2px; font-size: 20px; font-weight: 700; color: #111;
      outline: none; background: transparent;
    }
    .composer-title-input:focus { border-bottom-color: var(--line-green); }
    .composer-title-input::placeholder { color: #B8BCC2; font-weight: 500; }

    .composer-group-row {
      margin-top: 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .composer-group-label { font-size: 13px; color: var(--sub); font-weight: 600; }
    .composer-select {
      padding: 6px 12px; font-size: 14px; border-radius: 99px;
      border: 1px solid #DCDFE4; background: #F7F8FA; color: #111; outline: none;
    }
    .composer-new-group {
      padding: 6px 12px; font-size: 14px; border-radius: 99px;
      border: 1.5px solid var(--line-green); outline: none; width: 170px;
    }
    .composer-warn {
      margin-top: 12px; padding: 8px 12px; border-radius: 8px;
      background: #FFF3E0; color: #B25E00; font-size: 12px; display: none;
    }
    .composer-meta {
      margin: 18px 0 10px; font-size: 13px; color: var(--sub);
      display: flex; align-items: center; justify-content: space-between;
    }
    .preview-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
    }
    @media (min-width: 600px) {
      .preview-grid { grid-template-columns: repeat(4, 1fr); gap: 8px; }
    }
    .preview-cell {
      aspect-ratio: 1 / 1; position: relative; border-radius: 6px;
      overflow: hidden; background: #F2F3F5;
    }
    .preview-cell img, .preview-cell video {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .preview-remove {
      position: absolute; top: 6px; right: 6px; z-index: 5;
      width: 24px; height: 24px; border-radius: 50%; border: none;
      background: rgba(0,0,0,0.62); color: #fff; font-size: 13px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .preview-add-tile {
      aspect-ratio: 1 / 1; border-radius: 6px;
      border: 1.5px dashed #C7CCD4; background: #FAFAFB;
      color: #666; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
      font-size: 12px; font-weight: 600;
    }
    .preview-add-tile:active { background: #EAF9F0; border-color: var(--line-green); color: #058A3C; }

    /* ===== 上傳中輕量浮動進度卡片 ===== */
    #uploadBanner {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
      width: calc(100% - 32px); max-width: 420px; z-index: 9400;
      background: #1A1A1A; color: #FFFFFF;
      border-radius: 14px; padding: 14px 16px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.28);
      display: none;
    }
    .ub-row {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 13px; font-weight: 600; margin-bottom: 8px; gap: 8px;
    }
    .ub-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .ub-pct { color: #5CE892; flex-shrink: 0; }
    .ub-track { width: 100%; height: 6px; background: rgba(255,255,255,0.2); border-radius: 99px; overflow: hidden; }
    .ub-fill { height: 100%; width: 0%; background: var(--line-green); transition: width 0.2s; }

    /* ===== 刪除／管理員彈窗 ===== */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 9200;
      background: rgba(0, 0, 0, 0.52);
      display: none; align-items: flex-end; justify-content: center;
    }
    @media (min-width: 600px) { .modal-backdrop { align-items: center; padding: 16px; } }
    .modal-sheet {
      width: 100%; max-width: 460px; max-height: 90vh;
      background: #fff; border-radius: 16px 16px 0 0;
      display: flex; flex-direction: column; overflow: hidden;
    }
    @media (min-width: 600px) { .modal-sheet { border-radius: 14px; } }
    .modal-head {
      padding: 14px 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-head h3 { margin: 0; font-size: 16px; font-weight: 700; }
    .modal-body { padding: 16px; overflow-y: auto; flex: 1; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 6px; }
    .form-control {
      width: 100%; padding: 10px 12px; font-size: 15px;
      border: 1.5px solid #E2E4E8; border-radius: 8px; outline: none; background: #fff;
    }
    .form-control:focus { border-color: var(--line-green); }

    .locked-banner {
      margin-bottom: 14px; padding: 10px 12px;
      background: #F2FBF6; color: #057A35;
      border-radius: 8px; font-size: 13px; font-weight: 600;
    }
    .err-text { color: var(--danger); font-size: 13px; margin-top: 8px; min-height: 18px; }
    .remember-row {
      display: flex; align-items: center; gap: 8px; font-size: 13px; color: #555; margin-top: 8px; cursor: pointer;
    }
    .modal-foot {
      padding: 12px 16px 16px; border-top: 1px solid var(--border);
      display: flex; gap: 10px;
    }
    .btn-primary {
      flex: 1; padding: 11px; font-size: 15px; font-weight: 700;
      background: var(--line-green); color: #fff; border: none; border-radius: 8px; cursor: pointer;
    }
    .btn-primary:disabled { background: #A5DFB9; cursor: not-allowed; }
    .btn-danger {
      flex: 1; padding: 11px; font-size: 15px; font-weight: 700;
      background: var(--danger); color: #fff; border: none; border-radius: 8px; cursor: pointer;
    }
    .btn-danger:disabled { background: #EF9A9A; cursor: not-allowed; }
    .btn-cancel {
      padding: 11px 18px; font-size: 14px; font-weight: 600;
      background: var(--surface); color: #333; border: none; border-radius: 8px; cursor: pointer;
    }

    /* ===== 仿 LINE 1/5 燈箱瀏覽視窗 ===== */
    #lightbox {
      position: fixed; inset: 0; z-index: 9000;
      background: #000000; color: #FFFFFF;
      display: none; flex-direction: column;
      user-select: none; touch-action: pan-y;
    }
    .lb-top {
      height: 56px; padding: 0 12px;
      display: flex; align-items: center; justify-content: space-between;
      background: linear-gradient(to bottom, rgba(0,0,0,0.75), rgba(0,0,0,0));
      position: absolute; top: 0; left: 0; right: 0; z-index: 30;
    }
    .lb-top-right { display: flex; align-items: center; gap: 8px; }
    .lb-icon-btn {
      width: 38px; height: 38px; border-radius: 50%; border: none;
      background: rgba(255,255,255,0.14); color: #fff;
      cursor: pointer; text-decoration: none;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .lb-icon-btn:hover { background: rgba(255,255,255,0.24); }
    .lb-counter { font-size: 15px; font-weight: 600; letter-spacing: 0.5px; }
    .lb-stage {
      flex: 1; display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden; width: 100%; height: 100%;
    }
    #lbImg { max-width: 100%; max-height: 100%; object-fit: contain; transition: opacity 0.15s; }
    #lbVideo {
      width: 90%; max-width: 960px; height: 72vh;
      border: none; border-radius: 6px; background: #000; display: none; z-index: 5;
    }
    .lb-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 44px; height: 64px; border: none; z-index: 25;
      background: rgba(0,0,0,0.38); color: #fff;
      cursor: pointer; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .lb-nav:hover { background: rgba(0,0,0,0.62); }
    .lb-prev { left: 10px; }
    .lb-next { right: 10px; }
    .lb-spinner {
      position: absolute; width: 30px; height: 30px; z-index: 15;
      border: 2.5px solid rgba(255,255,255,0.25); border-top-color: #fff;
      border-radius: 50%; animation: spin 0.8s linear infinite; display: none;
    }
    .lb-bottom {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 20;
      padding: 12px 16px 16px; text-align: center;
      font-size: 13px; color: rgba(255,255,255,0.82);
      background: linear-gradient(to top, rgba(0,0,0,0.72), rgba(0,0,0,0));
      pointer-events: none;
    }

    /* 載入與空狀態 */
    .empty-state {
      max-width: 420px; margin: 56px auto; padding: 0 20px;
      text-align: center; color: var(--sub); font-size: 14px; line-height: 1.7;
    }
    .empty-state .err-box {
      background: #FFF5F5; border: 1px solid #FAD2D2; color: #C62828;
      padding: 14px; border-radius: 10px; margin-bottom: 14px; text-align: left;
    }
    .empty-action-btn {
      margin-top: 14px; padding: 10px 22px; border-radius: 99px; border: none;
      background: var(--line-green); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .mini-spinner {
      width: 26px; height: 26px; margin: 0 auto 12px;
      border: 2.5px solid #E5E7EB; border-top-color: var(--line-green);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }

    .toast {
      position: fixed; bottom: 92px; left: 50%; transform: translateX(-50%);
      background: rgba(17,17,17,0.9); color: #fff;
      padding: 10px 18px; border-radius: 24px; font-size: 13px;
      z-index: 9500; display: none; white-space: nowrap; max-width: 90vw;
      overflow: hidden; text-overflow: ellipsis;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- 全域原生照片／影片選擇器（點「＋」直接呼叫） -->
<input id="quickFilePicker" type="file" accept="image/*,video/*" multiple style="display:none;" onchange="onQuickFilesPicked(event)">

<!-- ===== 首頁：所有相簿 ===== -->
<div id="homeView">
  <div class="header">
    <div class="header-inner">
      <div class="header-top">
        <div class="header-left">
          <button class="icon-btn circle-soft" data-tip="所有相簿" aria-label="所有相簿" onclick="resetToAllAlbums()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 7.5C3 6.4 3.9 5.5 5 5.5h3.2l1.6 1.8H16c1.1 0 2 .9 2 2v7.2c0 1.1-.9 2-2 2H5c-1.1 0-2-.9-2-2V7.5z"/>
              <path d="M6.4 15.2l2.9-3.5 2.2 2.4 1.3-1.5 2 2.6H6.4z" fill="currentColor" stroke="none"/>
              <circle cx="13.8" cy="10.3" r="1.1" fill="currentColor" stroke="none"/>

<div id="toast" class="toast"></div>

<script>
  // ===== ★ 請換成你的 GAS 網頁應用程式網址（結尾為 /exec）=====
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxQtoNHR6rFc0sRDe7GwToWLiyLFH1J8O1Fn_ew5jX2Cs5iObfSmHk8XsGgqAYE273Y/exec";

  const urlParams     = new URLSearchParams(window.location.search);
  const LOCKED_GROUP  = (urlParams.get("group") || "").trim();
  const BASE_PAGE_URL = window.location.origin + window.location.pathname;

  const MAX_FILE_MB = 25;
  const MAX_FILE_BYTES = MAX_FILE_MB * 1024 * 1024;
  const DEL_PASS_LOCAL_KEY = "family_album_del_pass_cf_v1";
  const PAGE_SIZE = 40;

  let allAlbums = [];
  let allGroups = [];
  let activeGroup = LOCKED_GROUP || "全部";
  let sortDesc = true;
  let visibleLimit = PAGE_SIZE;

  let albumItemsCache = {};
  let currentAlbum = null;
  let currentItems = [];
  let currentIndex = 0;

  // 直覺選圖與上傳狀態
  let pickerMode = "new_album";   // "new_album" | "append_new_album" | "direct_upload"
  let directTargetAlbum = null;
  let composerFiles = [];         // [{ file, previewUrl, isVideo }]
  let isUploading = false;

  let pendingDeleteType = "";
  let pendingDeleteAlbum = null;
  let isDeleting = false;

  function thumbUrl(id) { return `https://lh3.googleusercontent.com/d/${id}=w600`; }
  function fullUrl(id)  { return `https://lh3.googleusercontent.com/d/${id}=w1600`; }
  function fallbackUrl(id, size) { return `https://drive.google.com/thumbnail?id=${id}&sz=w${size}`; }
  function videoPreviewUrl(id) { return `https://drive.google.com/file/d/${id}/preview`; }
  function downloadUrl(id) { return `https://drive.google.com/uc?export=download&id=${id}`; }

  function albumCacheKey(album) {
    return `${album.folderId || ""}|${album.group}|${album.name}`;
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
    }[m]));
  }

  function formatCountText(album) {
    const parts = [];
    if (album.photoCount > 0) parts.push(`${album.photoCount}張照片`);
    if (album.videoCount > 0) parts.push(`${album.videoCount}部影片`);
    return parts.length ? parts.join(" · ") : `${album.count}個項目`;
  }

  function isVideoFile(file) {
    return (file.type && file.type.startsWith("video/")) || /\.(mp4|mov|m4v|webm|avi|mkv)$/i.test(file.name);
  }

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.style.display = "block";
    clearTimeout(t._timer);
    t._timer = setTimeout(() => { t.style.display = "none"; }, 3000);
  }

  async function apiGet(params) {
    if (!GAS_API_URL || GAS_API_URL.includes("請換成你的部署ID")) {
      throw new Error("尚未在 index.html 填入正確的 GAS_API_URL！");
    }
    const qs = new URLSearchParams(params).toString();
    const res = await fetch(`${GAS_API_URL}?${qs}`, { method: "GET", redirect: "follow" });
    if (!res.ok) throw new Error(`HTTP 錯誤 (${res.status})`);
    return await res.json();
  }

  async function apiPost(payload) {
    if (!GAS_API_URL || GAS_API_URL.includes("請換成你的部署ID")) {
      throw new Error("尚未在 index.html 填入正確的 GAS_API_URL！");
    }
    const res = await fetch(GAS_API_URL, {
      method: "POST",
      redirect: "follow",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error(`HTTP 錯誤 (${res.status})`);
    return await res.json();
  }

  function isDeviceAdmin() {
    return Boolean(localStorage.getItem(DEL_PASS_LOCAL_KEY));
  }

  function updateOwnerUI() {
    document.getElementById("ownerBadge").style.display = isDeviceAdmin() ? "inline-block" : "none";
  }

  function initApp() {
    if (LOCKED_GROUP) {
      document.title = `${LOCKED_GROUP} - 相簿`;
      document.getElementById("appHeaderTitle").textContent = LOCKED_GROUP;
      document.getElementById("groupTabs").style.display = "none";
    }
    updateOwnerUI();
    setupSwipeAndKeys();
    document.addEventListener("click", () => hidePopover());
    loadSummary();
  }

  async function loadSummary() {
    try {
      const res = await apiGet({ action: "summary", group: LOCKED_GROUP });
      applySummary(res);
    } catch (err) {
      showErrorState(err.message || "無法連線至雲端相簿 API");
    }
  }

  function applySummary(res) {
    if (!res) { showErrorState("伺服器未回傳資料，請重新整理。"); return; }
    if (res.ok === false) { showErrorState(res.message || "讀取相簿失敗"); return; }

    if (LOCKED_GROUP) {
      allGroups = [LOCKED_GROUP];
      activeGroup = LOCKED_GROUP;
    } else {
      allGroups = ["全部", ...(res.groups || [])];
      if (activeGroup !== "全部" && !allGroups.includes(activeGroup)) {
        activeGroup = "全部";
      }
    }
    allAlbums = res.albums || [];
    visibleLimit = PAGE_SIZE;
    document.getElementById("syncInfo").textContent = res.lastSync ? `更新：${res.lastSync}` : "";
    renderTabs();
    renderAlbums(Boolean(res.needSync));
  }

  function showErrorState(msg) {
    document.getElementById("albumList").innerHTML = "";
    document.getElementById("loadMoreWrap").style.display = "none";
    document.getElementById("countInfo").textContent = "";
    const el = document.getElementById("emptyState");
    el.style.display = "block";
    el.innerHTML = `
      <div class="err-box"><strong>連線或設定異常：</strong>${escapeHtml(msg)}</div>
      <button class="empty-action-btn" onclick="loadSummary()">重新載入</button>
    `;
  }

  function resetToAllAlbums() {
    if (!LOCKED_GROUP) activeGroup = "全部";
    visibleLimit = PAGE_SIZE;
    clearSearch();
    renderTabs();
    renderAlbums(false);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function toggleSearchBar() {
    const wrap = document.getElementById("searchBarWrap");
    const input = document.getElementById("searchInput");
    if (wrap.classList.contains("collapsed")) {
      wrap.classList.remove("collapsed");
      input.focus();
    } else if (input.value) {
      input.focus();
    } else {
      wrap.classList.add("collapsed");
    }
  }

  function renderTabs() {
    if (LOCKED_GROUP) return;
    const box = document.getElementById("groupTabs");
    box.innerHTML = allGroups.map((g, i) => `
      <button class="group-tab ${g === activeGroup ? 'active' : ''}" onclick="selectGroupByIndex(${i})">${escapeHtml(g)}</button>
    `).join("");

    const copyBtn = document.getElementById("copyLinkBtn");
    if (activeGroup !== "全部") {
      copyBtn.style.display = "inline-flex";
      document.getElementById("copyLinkLabel").textContent = `複製「${activeGroup}」專屬連結`;
    } else {
      copyBtn.style.display = "none";
    }
  }

  function selectGroupByIndex(idx) {
    if (idx < 0 || idx >= allGroups.length) return;
    activeGroup = allGroups[idx];
    visibleLimit = PAGE_SIZE;
    renderTabs();
    renderAlbums(false);
  }

  function onSearchInput() {
    const q = document.getElementById("searchInput").value;
    document.getElementById("clearBtn").style.display = q ? "block" : "none";
    visibleLimit = PAGE_SIZE;
    renderAlbums(false);
  }

  function clearSearch() {
    document.getElementById("searchInput").value = "";
    document.getElementById("clearBtn").style.display = "none";
    visibleLimit = PAGE_SIZE;
    renderAlbums(false);
  }

  function showMoreAlbums() {
    visibleLimit += PAGE_SIZE;
    renderAlbums(false);
  }

  function renderAlbums(needSync) {
    const q = document.getElementById("searchInput").value.trim().toLowerCase();
    const list = allAlbums.filter(a => {
      const matchGroup = (activeGroup === "全部") || (a.group === activeGroup);
      const matchSearch = !q || a.name.toLowerCase().includes(q) || a.group.toLowerCase().includes(q);
      return matchGroup && matchSearch;
    });

    list.sort((a, b) => {
      const cmp = a.name.localeCompare(b.name, "zh-Hant", { numeric: true });
      return sortDesc ? -cmp : cmp;
    });

    document.getElementById("countInfo").textContent = `共 ${list.length} 本相簿`;
    const container = document.getElementById("albumList");
    const empty = document.getElementById("emptyState");
    const moreWrap = document.getElementById("loadMoreWrap");

    if (list.length === 0) {
      container.innerHTML = "";
      moreWrap.style.display = "none";
      empty.style.display = "block";
      if (needSync) {
        empty.innerHTML = `
          <div>尚未建立雲端相簿索引</div>
          <button class="empty-action-btn" onclick="syncNow()">立即掃描雲端硬碟相簿</button>
        `;
      } else if (q) {
        empty.innerHTML = `找不到包含「${escapeHtml(q)}」的相簿`;
      } else {
        empty.innerHTML = `目前尚無相簿<br>點擊右下角綠色「＋」即可選擇照片建立第一本相簿`;
      }
      return;
    }
    empty.style.display = "none";

    const shown = list.slice(0, visibleLimit);
    container.innerHTML = shown.map(album => {
      const covers = album.covers || [];
      const cNum = Math.min(Math.max(covers.length, 1), 4);
      const imgsHtml = covers.map(item => `
        <div class="collage-item">
          <img loading="lazy" src="${thumbUrl(item.id)}" data-id="${escapeHtml(item.id)}" onerror="handleThumbErr(this, 600)">
          ${item.t === "v" ? '<div class="video-badge"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="6,4 20,12 6,20"/></svg></div>' : ''}
        </div>
      `).join("");

      const origIdx = allAlbums.indexOf(album);
      const groupChip = LOCKED_GROUP ? "" : `<span class="group-chip">${escapeHtml(album.group)}</span>`;
      const dateHtml = album.updated ? `<span>${escapeHtml(album.updated)}</span>` : "";

      return `
        <div class="album-card" onclick="openAlbum(${origIdx})">
          <div class="collage c${cNum}">${imgsHtml}</div>
          <div class="album-footer">
            <div class="album-text">
              <div class="album-title">${escapeHtml(album.name)}</div>
              <div class="album-meta-line">
                <span>${escapeHtml(formatCountText(album))}</span>
                ${dateHtml}
                ${groupChip}
              </div>
            </div>
            <button class="card-dots-btn" aria-label="更多選項" onclick="openCardMenu(event, ${origIdx})">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <circle cx="12" cy="5.5" r="1.6"/>
                <circle cx="12" cy="12" r="1.6"/>
                <circle cx="12" cy="18.5" r="1.6"/>
              </svg>
            </button>
          </div>
        </div>
      `;
    }).join("");

    if (list.length > visibleLimit) {
      moreWrap.style.display = "block";
      document.getElementById("loadMoreBtn").textContent = `載入更多相簿（尚餘 ${list.length - visibleLimit} 本）`;
    } else {
      moreWrap.style.display = "none";
    }
  }

  function showPopover(anchorEl, html) {
    const menu = document.getElementById("popoverMenu");
    menu.innerHTML = html;
    menu.style.display = "block";

    const rect = anchorEl.getBoundingClientRect();
    const mw = menu.offsetWidth || 188;
    const mh = menu.offsetHeight || 120;

    let left = rect.right - mw;
    if (left < 10) left = 10;
    let top = rect.bottom + 6;
    if (top + mh > window.innerHeight - 10) {
      top = Math.max(10, rect.top - mh - 6);
    }
    menu.style.left = left + "px";
    menu.style.top = top + "px";
  }

    if (!activeGroup || activeGroup === "全部") return;

    if (navigator.clipboard && navigator.clipboard.writeText) {

  function fallbackCopy(text) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand("copy");
      showToast("已複製群組專屬連結");
    } catch (e) {
      window.prompt("請手動複製此群組專屬連結：", text);
    }
    document.body.removeChild(ta);
  }

  // ===== 點「＋」直覺開啟手機照片選擇器 =====
  function openQuickPicker(mode, targetAlbum) {
    if (isUploading) {
      showToast("目前有檔案正在上傳中，請稍候完成");
      return;
    }
    pickerMode = mode;
    directTargetAlbum = targetAlbum || null;
    const picker = document.getElementById("quickFilePicker");
    picker.value = "";
    picker.click();
  }

  function onQuickFilesPicked(event) {
    const rawFiles = Array.from(event.target.files || []);
    if (rawFiles.length === 0) return;

    const valid = [];
    const skipped = [];
    rawFiles.forEach(file => {
      if (file.size > MAX_FILE_BYTES) skipped.push(file.name);
      else valid.push(file);
    });

    if (valid.length === 0) {
      showToast(`所選檔案皆超過單檔 ${MAX_FILE_MB} MB 上限，無法上傳`);
      return;
    }

    // 情境 A：在相簿內（或卡片「上傳項目」）選完照片 → 立刻直接上傳！
    if (pickerMode === "direct_upload" && directTargetAlbum) {
      if (skipped.length > 0) {
        showToast(`已略過 ${skipped.length} 個超過 ${MAX_FILE_MB} MB 的檔案，開始上傳其餘 ${valid.length} 個`);
      }
      executeUploadFlow(
        LOCKED_GROUP || directTargetAlbum.group,
        directTargetAlbum.name,
        directTargetAlbum.folderId || "",
        valid
      );
      return;
    }

    // 情境 B：在首頁選完照片 → 進入仿 LINE「建立相簿」全螢幕預覽頁
    if (pickerMode === "new_album") {
      clearComposerFiles();
      appendToComposer(valid, skipped);
      openCreateAlbumView();
      return;
    }

    // 情境 C：在「建立相簿」預覽頁裡點「＋」補選更多照片
    if (pickerMode === "append_new_album") {
      appendToComposer(valid, skipped);
      renderComposerGrid();
    }
  }

  function clearComposerFiles() {
    composerFiles.forEach(item => {
      try { URL.revokeObjectURL(item.previewUrl); } catch (e) {}
    });
    composerFiles = [];
  }

  function appendToComposer(validFiles, skippedNames) {
    validFiles.forEach(file => {
      composerFiles.push({
        file: file,
        previewUrl: URL.createObjectURL(file),
        isVideo: isVideoFile(file)
      });
    });

    const warnEl = document.getElementById("composerWarn");
    if (skippedNames && skippedNames.length > 0) {
      warnEl.style.display = "block";
      warnEl.textContent = `已自動略過 ${skippedNames.length} 個超過 ${MAX_FILE_MB} MB 的檔案（${skippedNames.slice(0, 2).join("、")}${skippedNames.length > 2 ? "…" : ""}）`;
    } else if (pickerMode === "new_album") {
      warnEl.style.display = "none";
    }
  }

    if (LOCKED_GROUP) {
      groupRow.style.display = "none";

  function submitNewAlbum() {
    if (isUploading || composerFiles.length === 0) return;

    const albumName = document.getElementById("composerAlbumName").value.trim();
    if (!albumName) { showToast("請輸入相簿名稱"); return; }

    let targetGroup = LOCKED_GROUP;
    if (!targetGroup) {
      const selVal = document.getElementById("composerGroupSelect").value;
      targetGroup = (selVal === "__NEW__")
        ? document.getElementById("composerNewGroupInput").value.trim()
        : selVal;
    }
    if (!targetGroup) { showToast("請輸入群組名稱"); return; }

    const filesToUpload = composerFiles.map(item => item.file);
    // 關閉預覽畫面，改由底部浮動進度條顯示上傳進度
    clearComposerFiles();
    document.getElementById("createAlbumView").style.display = "none";
    document.body.style.overflow = "";

    executeUploadFlow(targetGroup, albumName, "", filesToUpload);
  }

  function readFileAsBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const str = String(reader.result || "");
        const idx = str.indexOf(",");
        resolve(idx >= 0 ? str.slice(idx + 1) : str);
      };
      reader.onerror = () => reject(new Error("讀取檔案失敗"));
      reader.readAsDataURL(file);
    });
  }

  function showUploadBanner(title, pct) {
    document.getElementById("uploadBanner").style.display = "block";
    document.getElementById("ubTitle").textContent = title;
    document.getElementById("ubPct").textContent = `${pct}%`;
    document.getElementById("ubFill").style.width = `${pct}%`;
  }

  function hideUploadBanner() {
    document.getElementById("uploadBanner").style.display = "none";
  }

  async function executeUploadFlow(targetGroup, targetAlbum, existingFolderId, files) {
    if (isUploading || !files || files.length === 0) return;
    isUploading = true;
    showUploadBanner(`準備上傳至「${targetAlbum}」...`, 5);

    try {
      const prep = await apiPost({
        action: "prepareUpload",
        groupName: targetGroup,
        albumName: targetAlbum,
        existingFolderId: existingFolderId,
        lockedGroup: LOCKED_GROUP
      });
      if (!prep || !prep.ok) throw new Error((prep && prep.message) ? prep.message : "無法建立相簿資料夾");

      const uploadedTokens = [];
      const total = files.length;
      let seq = prep.startIndex || 1;

      for (let i = 0; i < total; i++) {
        const file = files[i];
        const pct = Math.round((i / total) * 88) + 6;
        showUploadBanner(`正在上傳至「${prep.albumName}」（${i + 1} / ${total}）`, pct);

        const extMatch = file.name.match(/\.[^.]+$/);
        const ext = extMatch ? extMatch[0] : (isVideoFile(file) ? ".mp4" : ".jpg");
        const numberedName = `${prep.albumName}_${String(seq).padStart(3, "0")}${ext}`;
        seq++;

        const base64 = await readFileAsBase64(file);
        const res = await apiPost({
          action: "uploadFile",
          folderId: prep.folderId,
          fileName: numberedName,
          mimeType: file.type,
          base64Data: base64
        });
        if (!res || !res.ok) throw new Error((res && res.message) ? res.message : `檔案 ${file.name} 上傳失敗`);
        uploadedTokens.push(res.token);
      }

      showUploadBanner("正在更新相簿清單...", 96);
      const freshData = await apiPost({
        action: "finalizeUpload",
        groupName: prep.groupName,
        albumName: prep.albumName,
        folderId: prep.folderId,
        newTokens: uploadedTokens,
        lockedGroup: LOCKED_GROUP
      });

      showUploadBanner("上傳完成！", 100);
      applySummary(freshData);

      const targetIdx = allAlbums.findIndex(a => a.group === prep.groupName && a.name === prep.albumName);
      if (targetIdx >= 0 && freshData.updatedItems) {
        albumItemsCache[albumCacheKey(allAlbums[targetIdx])] = freshData.updatedItems;
        openAlbum(targetIdx);
      }

      setTimeout(() => hideUploadBanner(), 700);
      showToast(freshData.syncMessage || `已上傳 ${uploadedTokens.length} 個項目`);
    } catch (err) {
      hideUploadBanner();
      showToast("上傳失敗：" + err.message);
    } finally {
      isUploading = false;
    }
  }

  // ===== 管理員本機裝置驗證 =====

    document.getElementById("adminPassInput").value = "";

  async function submitAdminAuth() {
    const pass = document.getElementById("adminPassInput").value.trim();
    const errEl = document.getElementById("adminErrText");
    const btn = document.getElementById("adminSubmitBtn");
    if (!pass) { errEl.textContent = "請輸入密碼"; return; }

    btn.disabled = true;
    btn.textContent = "驗證中...";
    errEl.textContent = "";
    try {
      const res = await apiPost({ action: "verifyAdmin", passcode: pass });
      if (!res.ok) { errEl.textContent = res.message || "密碼錯誤"; return; }
      localStorage.setItem(DEL_PASS_LOCAL_KEY, pass);
      updateOwnerUI();
      closeAdminModal();
      showToast("已開啟此裝置管理員免密刪除");
    } catch (err) {
      errEl.textContent = "驗證失敗：" + err.message;
    } finally {
      btn.disabled = false;
      btn.textContent = "驗證並記住此裝置";
    }
  }

  function logoutAdmin() {
    localStorage.removeItem(DEL_PASS_LOCAL_KEY);
    updateOwnerUI();
    showToast("已清除此裝置的管理員記憶");
  }

  // ===== 單一相簿內頁 =====
  async function openAlbum(origIdx) {
    const album = allAlbums[origIdx];
    if (!album) return;
    currentAlbum = album;

    document.getElementById("detailTitle").textContent = album.name;
    document.getElementById("detailCount").textContent = formatCountText(album);
    document.getElementById("detailDate").textContent = album.updated || "";

    document.getElementById("homeView").style.display = "none";
    document.getElementById("detailView").style.display = "block";
    window.scrollTo(0, 0);

    const key = albumCacheKey(album);
    if (albumItemsCache[key]) {
      currentItems = albumItemsCache[key];
      renderPhotoGrid(currentItems);
      return;
    }

    document.getElementById("photoGrid").innerHTML = "";
    document.getElementById("detailLoading").style.display = "block";

    try {
      const res = await apiGet({
        action: "detail",
        groupName: album.group,
        albumName: album.name,
        folderId: album.folderId || "",
        lockedGroup: LOCKED_GROUP
      });
      if (!currentAlbum || albumCacheKey(currentAlbum) !== key) return;
      document.getElementById("detailLoading").style.display = "none";
      if (!res || !res.ok) {
        showToast((res && res.message) ? res.message : "載入相簿內容失敗");
        return;
      }
      albumItemsCache[key] = res.items || [];
      currentItems = albumItemsCache[key];
      renderPhotoGrid(currentItems);
    } catch (err) {
      document.getElementById("detailLoading").style.display = "none";
      showToast("載入失敗：" + err.message);
    }
  }

  function renderPhotoGrid(items) {
    const grid = document.getElementById("photoGrid");
    grid.innerHTML = items.map((item, i) => `
      <div class="photo-cell" onclick="openLightbox(${i})">
        <img loading="lazy" src="${thumbUrl(item.id)}" data-id="${escapeHtml(item.id)}" onerror="handleThumbErr(this, 600)">
        ${item.t === "v" ? '<div class="video-badge"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="6,4 20,12 6,20"/></svg></div><div class="video-tag-corner">影片</div>' : ''}
      </div>
    `).join("");

  function closeAlbum() {

  // ===== 仿 LINE 1/5 燈箱瀏覽 =====
  function openLightbox(index) {
    if (!currentItems || currentItems.length === 0) return;
    currentIndex = index;
    document.getElementById("lightbox").style.display = "flex";
    document.body.style.overflow = "hidden";
    showLightboxItem();
  }

  function closeLightbox() {
    document.getElementById("lbVideo").src = "";
    document.getElementById("lightbox").style.display = "none";
    document.body.style.overflow = "";
  }

  function stepPhoto(delta) {
    if (!currentItems || currentItems.length === 0) return;
    const total = currentItems.length;
    currentIndex = (currentIndex + delta + total) % total;
    showLightboxItem();
  }

  function showLightboxItem() {
    const item = currentItems[currentIndex];
    const total = currentItems.length;
    if (!item) return;

    document.getElementById("lbCounter").textContent = `${currentIndex + 1} / ${total}`;
    document.getElementById("lbDownload").href = downloadUrl(item.id);
    document.getElementById("lbBottom").textContent = currentAlbum ? currentAlbum.name : "";

    const img = document.getElementById("lbImg");
    const vid = document.getElementById("lbVideo");
    const spinner = document.getElementById("lbSpinner");

    if (item.t === "v") {
      img.style.display = "none";
      img.src = "";
      vid.style.display = "block";
      spinner.style.display = "block";
      vid.onload = () => { spinner.style.display = "none"; };
      vid.src = videoPreviewUrl(item.id);
    } else {
      vid.src = "";
      vid.style.display = "none";
      img.style.display = "block";
      spinner.style.display = "block";
      img.style.opacity = "0.2";
      img.dataset.fb = "";

      img.onload = () => { spinner.style.display = "none"; img.style.opacity = "1"; };
      img.onerror = () => {
        if (!img.dataset.fb) { img.dataset.fb = "1"; img.src = fallbackUrl(item.id, 1600); }
        else { spinner.style.display = "none"; }
      };
      img.src = fullUrl(item.id);

      if (total > 1) {
        const nextItem = currentItems[(currentIndex + 1) % total];
        if (nextItem && nextItem.t === "i") new Image().src = fullUrl(nextItem.id);
      }
    }
  }

  function setupSwipeAndKeys() {
    const stage = document.getElementById("lbStage");
    let startX = 0;
    stage.addEventListener("touchstart", e => {
      if (e.touches.length === 1) startX = e.touches[0].clientX;
    }, { passive: true });
    stage.addEventListener("touchend", e => {
      if (e.changedTouches.length !== 1) return;
      const diff = e.changedTouches[0].clientX - startX;
      if (Math.abs(diff) > 45) stepPhoto(diff < 0 ? 1 : -1);
    }, { passive: true });

    document.addEventListener("keydown", e => {
      if (document.getElementById("deleteModal").style.display === "flex") {
        if (e.key === "Escape") closeDeleteModal();
        return;
      }
      if (document.getElementById("adminModal").style.display === "flex") {
        if (e.key === "Escape") closeAdminModal();
        return;
      }
      if (document.getElementById("lightbox").style.display !== "flex") return;
      if (e.key === "ArrowRight") stepPhoto(1);
      else if (e.key === "ArrowLeft") stepPhoto(-1);
      else if (e.key === "Escape") closeLightbox();
    });
  }

  // ===== 刪除確認 =====
  function openDeleteForAlbum(origIdx) {
    openDeleteModal("album", allAlbums[origIdx]);
  }

  function openDeleteModal(type, explicitAlbum) {
    const target = explicitAlbum || currentAlbum;
    if (!target) return;
    pendingDeleteType = type;
    pendingDeleteAlbum = target;

    const titleEl = document.getElementById("delModalTitle");
    const descEl  = document.getElementById("delModalDesc");
    const ownerNotice = document.getElementById("delOwnerNotice");
    const passWrap = document.getElementById("delPassWrap");
    const passInput = document.getElementById("delPassInput");
    const errEl = document.getElementById("delErrText");

    errEl.textContent = "";
    passInput.value = "";

    if (type === "album") {
      titleEl.textContent = "刪除相簿";
      descEl.textContent = `確定要刪除「${target.name}」（${formatCountText(target)}）嗎？`;
    } else {
      const item = currentItems[currentIndex];
      const kind = (item && item.t === "v") ? "這部影片" : "這張照片";
      titleEl.textContent = `刪除${kind}`;
      descEl.textContent = `確定要刪除「${target.name}」中的第 ${currentIndex + 1} 個項目嗎？`;
    }

    if (isDeviceAdmin()) {
      ownerNotice.style.display = "block";
      ownerNotice.textContent = "已識別管理員裝置，無需重複輸入密碼";
      passWrap.style.display = "none";
    } else {
      ownerNotice.style.display = "none";
      passWrap.style.display = "block";
      setTimeout(() => passInput.focus(), 100);
    }

    document.getElementById("deleteModal").style.display = "flex";
  }

  function closeDeleteModal() {
    if (isDeleting) return;
    document.getElementById("deleteModal").style.display = "none";
  }

  async function confirmDelete() {
    if (isDeleting || !pendingDeleteAlbum) return;

    const savedDelPass = localStorage.getItem(DEL_PASS_LOCAL_KEY) || "";
    const inputPass = document.getElementById("delPassInput").value.trim();
    const passToSend = savedDelPass || inputPass;
    const errEl = document.getElementById("delErrText");

    if (!passToSend) { errEl.textContent = "請輸入刪除密碼"; return; }

    isDeleting = true;
    const confirmBtn = document.getElementById("delConfirmBtn");
    const cancelBtn  = document.getElementById("delCancelBtn");
    const closeBtn   = document.getElementById("delCloseBtn");
    confirmBtn.disabled = true;
    cancelBtn.disabled = true;
    closeBtn.disabled = true;
    confirmBtn.textContent = "刪除中...";
    errEl.textContent = "";

    const targetGroup = pendingDeleteAlbum.group;
    const targetAlbumName = pendingDeleteAlbum.name;
    const targetFolderId = pendingDeleteAlbum.folderId || "";
    const targetKey = albumCacheKey(pendingDeleteAlbum);

    try {
      let res;
      if (pendingDeleteType === "album") {
        res = await apiPost({
          action: "deleteAlbum",
          passcode: passToSend,
          groupName: targetGroup,
          albumName: targetAlbumName,
          folderId: targetFolderId,
          lockedGroup: LOCKED_GROUP
        });
      } else {
        const item = currentItems[currentIndex];
        res = await apiPost({
          action: "deleteItem",
          passcode: passToSend,
          groupName: targetGroup,
          albumName: targetAlbumName,
          folderId: targetFolderId,
          fileId: item.id,
          lockedGroup: LOCKED_GROUP
        });
      }

      if (!res || !res.ok) {
        if (res && res.needAuth) {
          localStorage.removeItem(DEL_PASS_LOCAL_KEY);
          updateOwnerUI();
          document.getElementById("delOwnerNotice").style.display = "none";
          document.getElementById("delPassWrap").style.display = "block";
          document.getElementById("delPassInput").value = "";
        }
        errEl.textContent = (res && res.message) ? res.message : "刪除失敗";
        return;
      }

      if (!savedDelPass && document.getElementById("delRememberCheck").checked) {
        localStorage.setItem(DEL_PASS_LOCAL_KEY, passToSend);
        updateOwnerUI();
      }

      applySummary(res);
      document.getElementById("deleteModal").style.display = "none";

      if (pendingDeleteType === "album") {
        delete albumItemsCache[targetKey];
        closeLightbox();
        if (currentAlbum && currentAlbum.name === targetAlbumName && currentAlbum.group === targetGroup) {
          closeAlbum();
        }
      } else {
        const remaining = res.updatedItems || [];
        const updatedIdx = allAlbums.findIndex(a => a.group === targetGroup && a.name === targetAlbumName);
        if (updatedIdx < 0 || remaining.length === 0) {
          delete albumItemsCache[targetKey];
          closeLightbox();
          closeAlbum();
        } else {
          albumItemsCache[albumCacheKey(allAlbums[updatedIdx])] = remaining;
          openAlbum(updatedIdx);
          if (currentIndex >= currentItems.length) currentIndex = currentItems.length - 1;
          document.getElementById("lbVideo").src = "";
          showLightboxItem();
        }
      }
      showToast(res.message || "已移至雲端硬碟垃圾桶");
    } catch (err) {
      errEl.textContent = "發生錯誤：" + err.message;
    } finally {
      isDeleting = false;
      confirmBtn.disabled = false;
      cancelBtn.disabled = false;
      closeBtn.disabled = false;
      confirmBtn.textContent = "確認刪除";
    }
  }

  async function syncNow() {
    const btn = document.getElementById("syncBtn");
    btn.disabled = true;
    btn.classList.add("spinning");
    showToast("正在同步雲端最新相簿...");
    try {
      const res = await apiPost({ action: "sync", lockedGroup: LOCKED_GROUP });
      if (res && res.ok) {
        albumItemsCache = {};
        applySummary(res);
        showToast(res.syncMessage || "同步完成");
      } else {
        showToast((res && res.message) ? res.message : "同步失敗");
      }
    } catch (err) {
      showToast("同步錯誤：" + err.message);
    } finally {
      btn.disabled = false;
      btn.classList.remove("spinning");
    }
  }

  initApp();
</script>
</body>
